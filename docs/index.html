<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 算力链 · 行情终端 AI Compute Chain Terminal</title>
<style>
  :root{--bg:#0a0e16;--bg2:#0e131d;--panel:#121826;--panel2:#161d2c;--bd:#1f2838;--bd2:#2a3447;
    --tx:#e6ebf5;--mut:#8a94a8;--dim:#5e6678;--up:#ff4d57;--down:#1fc78b;--flat:#6b7384;--accent:#3b82f6;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;}
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#10192b 0%,var(--bg) 60%);color:var(--tx);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;}
  header{padding:15px 20px 8px;}
  h1{font-size:17px;margin:0;font-weight:600;display:flex;align-items:center;gap:9px;}
  h1 small{font-size:11px;color:var(--dim);font-weight:400;}
  h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--down);box-shadow:0 0 10px var(--down);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .meta{font-size:11px;color:var(--mut);margin-top:6px;font-family:var(--mono);text-align:center;}
  .hdrtop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .hdrtop h1{justify-content:center;font-size:19px;}
  .hdrbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .gsearch{font-size:12.5px;padding:6px 12px;border:1px solid var(--bd2);border-radius:8px;background:var(--panel);color:var(--tx);width:220px;font-family:inherit;}
  .gsearch:focus{outline:none;border-color:var(--accent);}
  @media(max-width:860px){.hdrtop h1 small{display:none;}}
  @media(max-width:560px){.gsearch{width:150px;} .hdrbtns{width:100%;}}
  .cmodebtn{font-size:12px;padding:6px 13px;border:1px solid var(--bd2);border-radius:8px;background:var(--panel);color:var(--tx);cursor:pointer;font-family:inherit;}
  .cmodebtn:hover{border-color:var(--accent);}
  #refreshBtn:active{transform:scale(.96);}
  .cmodebtn:hover{border-color:var(--accent);color:#fff;}
  .tabs{display:flex;gap:4px;padding:10px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--bd);}
  .tab{font-size:13px;padding:7px 15px;border:none;background:none;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;border-radius:6px 6px 0 0;line-height:1.25;text-align:center;}
  .tab small{display:block;font-size:9.5px;color:var(--dim);font-weight:400;}
  .tab:hover{color:var(--tx);background:var(--panel);}
  .tab.on{color:#fff;border-bottom-color:var(--accent);font-weight:600;}
  main{padding:16px;max-width:1240px;margin:0 auto;}
  .sec{display:none;} .sec.on{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .secTitle{font-size:17px;font-weight:600;margin:14px 0 12px;display:flex;align-items:baseline;gap:9px;}
  .secTitle span{font-size:11px;color:var(--dim);font-weight:400;letter-spacing:.5px;}
  .secTitle .hb{font-size:12px;padding:4px 13px;border:1px solid var(--bd2);border-radius:7px;background:var(--panel);color:var(--mut);cursor:pointer;font-family:inherit;font-weight:400;letter-spacing:0;}
  .secTitle .hb:hover{color:var(--tx);} .secTitle .hb.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .zh2{display:flex;flex-direction:column;line-height:1.16;}
  .zh2 .en{font-size:10px;color:var(--dim);font-weight:400;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:11px;margin-bottom:18px;}
  .icard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--bd);border-radius:12px;padding:13px 15px;position:relative;overflow:hidden;text-align:left;cursor:pointer;color:var(--tx);font-family:inherit;transition:transform .1s,border-color .1s;}
  .icard:hover{transform:translateY(-2px);border-color:var(--bd2);}
  .icard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}
  .icard.u::after{background:var(--up);box-shadow:0 0 12px var(--up);}
  .icard.d::after{background:var(--down);box-shadow:0 0 12px var(--down);}
  .icard .nm{font-size:12px;color:var(--mut);} .icard .nm .en{font-size:10px;color:var(--dim);}
  .icard .pt{font-size:21px;font-weight:600;margin-top:4px;font-family:var(--mono);}
  .icard .ch{font-size:13px;font-weight:700;margin-top:3px;font-family:var(--mono);}
  .bre b.u{color:var(--up);} .bre b.d{color:var(--down);}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  .panel{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--bd);border-radius:14px;padding:13px 15px;}
  .panel.full{grid-column:1/-1;}
  .panel .pt{font-size:13.5px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .panel .ps{font-size:11px;color:var(--dim);font-weight:400;}
  .chart{width:100%;}
  select{font-size:12px;padding:4px 8px;border:1px solid var(--bd2);border-radius:7px;background:var(--panel);color:var(--tx);font-family:inherit;}

  .controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}

  .controls button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  input::placeholder{color:var(--dim);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;overflow:hidden;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;}
  th{background:var(--bg2);color:var(--mut);font-weight:600;font-size:11px;}
  tr:hover td{background:var(--panel2);} tr.clk{cursor:pointer;}

  .k-etf{font-size:9.5px;color:#9bd;background:#16243a;padding:1px 5px;border-radius:4px;margin-left:5px;}
  .track{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .thead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
  .thead .tn{font-size:15px;font-weight:600;} .thead .tn .en{font-size:10px;color:var(--dim);font-weight:400;display:block;}
  .thead .ly{font-size:11px;color:var(--dim);}

  .subl{font-size:10.5px;letter-spacing:1px;color:var(--dim);margin:8px 0 6px;font-weight:600;}
  .heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:7px;}

  .brief .intro{font-size:13.5px;line-height:1.75;color:#cfd6e4;margin:0 0 14px;padding:12px 14px;background:rgba(59,130,246,.06);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;}

  .brief ul{margin:0;padding-left:0;list-style:none;} .brief li{margin:9px 0;font-size:13.5px;line-height:1.7;padding-left:16px;position:relative;color:#dde3ee;} .brief li::before{content:"▸";position:absolute;left:0;color:var(--accent);}
  .brief .bsec{margin:14px 0;padding:12px 14px;background:rgba(255,255,255,.02);border:1px solid var(--bd);border-radius:10px;}
  .brief .bsec h4{margin:0 0 4px;}
  .brief .blabel{color:var(--mut);font-size:12.5px;}
  .brief .briefchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .brief .bchip{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--bd2);white-space:nowrap;}
  .brief .bchip:hover{border-color:var(--border-strong,#3a4459);}
  .stratbadge{font-size:11px;padding:2px 9px;border-radius:6px;background:#16243a;color:#6fb0ff;font-weight:500;margin-left:8px;}
  .secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:4px;}
  .seccard{border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;background:var(--panel);}
  .seccard .sname{font-weight:600;font-size:13px;} .seccard .stance{font-size:10px;padding:1px 7px;border-radius:5px;margin-left:6px;font-weight:600;}
  .stance.watch{background:#10243f;color:#6fb0ff;} .stance.avoid{background:#2c2c2a;color:#b4b2a9;}
  .seccard .sreason{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.5;}
  .pick{display:flex;align-items:flex-start;gap:12px;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer;}
  .pick:hover{background:var(--panel2);} .pick .pn{font-weight:600;font-size:13px;min-width:128px;}
  .pick .pn .pc{font-family:var(--mono);font-size:11px;color:var(--mut);margin-left:6px;}
  .pick .pr{font-size:12px;color:#cfd6e4;line-height:1.5;}
  .tbcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
  @media(max-width:700px){.tbcols{grid-template-columns:1fr;}}
  .tbcol{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:10px 13px;}
  .tbhd{font-size:14px;font-weight:600;margin-bottom:4px;}
  .tbgrp{font-size:15.5px;font-weight:700;color:var(--tx);margin:14px 0 6px;border-top:1px solid var(--bd);padding-top:10px;letter-spacing:.5px;}
  .tbrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 5px;border-radius:6px;cursor:pointer;font-size:12.5px;}
  .tbrow:hover{background:var(--panel2);}
  .tbrow .tbn{color:#dde3ee;} .tbrow .tbn em{color:var(--mut);font-style:normal;font-family:var(--mono);font-size:11px;margin-left:4px;}
  .empty{color:var(--mut);font-size:13px;padding:30px;text-align:center;}
  .foot{color:var(--dim);font-size:11px;margin-top:24px;line-height:1.6;font-family:var(--mono);}
  /* 详情页 */
  .backbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .backbtn{font-size:12.5px;padding:6px 13px;border:1px solid var(--bd2);border-radius:8px;background:var(--panel);color:var(--tx);cursor:pointer;font-family:inherit;}
  .backbtn:hover{border-color:var(--accent);color:#fff;}
  .dhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .dhead .dn{font-size:22px;font-weight:600;} .dhead .den{font-size:12px;color:var(--mut);}
  .dhead .dp{font-size:24px;font-weight:700;font-family:var(--mono);} .dhead .dc{font-size:15px;font-weight:700;font-family:var(--mono);}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;}
  .stat .l{font-size:11px;color:var(--mut);} .stat .v{font-size:16px;font-weight:600;font-family:var(--mono);margin-top:3px;}
  .inds{display:flex;flex-wrap:wrap;gap:7px;}
  .indchip{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--bd2);background:var(--panel);}
  .indchip b{font-weight:700;} .good{color:var(--up);} .bad{color:var(--down);} .neu{color:var(--mut);}
  .profile{font-size:13px;line-height:1.7;color:#cfd6e4;}
  .profile .row{display:flex;gap:8px;margin:4px 0;} .profile .row .k{color:var(--mut);min-width:64px;}
  .disc{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.6;}
  .analysis{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--bd2);border-radius:14px;padding:16px 18px;margin-bottom:13px;}
  .analysis .ahdr{font-size:14px;font-weight:600;line-height:1.7;margin-bottom:10px;color:#fff;}
  .analysis .ast{font-size:11px;color:var(--mut);font-weight:400;font-family:var(--mono);}
  .analysis .asec{font-size:13px;line-height:1.7;color:#dde3ee;margin:9px 0;}
  .analysis .atag{display:inline-block;font-size:11px;font-weight:600;color:#6fb0ff;background:#10243f;border-radius:5px;padding:1px 9px;margin-right:8px;}
  .analysis ul{margin:6px 0 0;padding-left:18px;} .analysis li{margin:4px 0;}
  .analysis em{color:var(--mut);font-style:normal;font-size:11px;}
  .analysis .adata{font-size:11px;color:var(--dim);margin-top:11px;}
  .analysis .adisc{font-size:11.5px;color:#e6a3ab;margin-top:6px;}
  /* 语言选择遮罩 */
  #langmask{position:fixed;inset:0;z-index:9999;background:radial-gradient(900px 500px at 50% 10%,#12203a,#0a0e16 70%);display:flex;align-items:center;justify-content:center;}
  #langmask .lbox{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--bd2);border-radius:18px;padding:34px 32px;max-width:420px;width:88%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  #langmask .llogo{font-size:20px;font-weight:700;margin-bottom:4px;}
  #langmask .lsub{font-size:12px;color:var(--mut);font-family:var(--mono);margin-bottom:22px;}
  #langmask .lask{font-size:13px;color:var(--dim);margin-bottom:16px;}
  #langmask .lbtns{display:flex;gap:12px;justify-content:center;}
  #langmask .lbtn{flex:1;font-size:15px;font-weight:600;padding:16px 10px;border:1px solid var(--bd2);border-radius:12px;background:var(--panel);color:var(--tx);cursor:pointer;font-family:inherit;transition:transform .1s,border-color .1s;}
  #langmask .lbtn:hover{transform:translateY(-2px);border-color:var(--accent);color:#fff;}
  #langmask .lbtn small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:4px;}
</style>
</head>
<body>
<div id="langmask" style="display:none">
  <div class="lbox">
    <div class="llogo">AI大模型 · 美股A股行情</div>

<script>
let RED="#ff4d57",GREEN="#1fc78b",UP="#ff4d57",DOWN="#1fc78b",UP_RGB="255,77,87",DOWN_RGB="31,199,139",GREENUP=false;
const RED_RGB="255,77,87",GREEN_RGB="31,199,139",FLAT="#6b7384",ACC="#3b82f6",AX="#5e6678",GRID="#1f2838",TXT="#8a94a8";
try{GREENUP=localStorage.getItem("greenup")==="1";}catch(e){}
let LANG="zh";try{if(localStorage.getItem("lang")==="en")LANG="en";}catch(e){}
function L(zh,en){return LANG==="en"?(en==null?zh:en):zh;}
let TRKEN={};
function TRK(t){return LANG==="en"?(TRKEN[t]||t):t;}
function locale(){return LANG==="en"?"en-US":"zh-CN";}
/* 取对象的语言字段:EN 优先取 field_en,缺失回退中文 */
function ML(obj,field){if(!obj)return "";if(LANG==="en"&&obj[field+"_en"]!=null&&obj[field+"_en"]!=="")return obj[field+"_en"];return obj[field]!=null?obj[field]:"";}
function applyColorMode(){UP=GREENUP?GREEN:RED;DOWN=GREENUP?RED:GREEN;UP_RGB=GREENUP?GREEN_RGB:RED_RGB;DOWN_RGB=GREENUP?RED_RGB:GREEN_RGB;
  try{document.documentElement.style.setProperty("--up",UP);document.documentElement.style.setProperty("--down",DOWN);}catch(e){}}
applyColorMode();
const base={backgroundColor:"transparent",textStyle:{color:TXT,fontFamily:"inherit"}};
function dir(p){return p>0?"up":(p<0?"down":"flat");}
function col(p){return p>0?UP:(p<0?DOWN:FLAT);}
function fmtp(p){return (p==null)?"—":(p>0?"+":"")+p.toFixed(2)+"%";}
function bi(zh,en){if(LANG==="en")return en||zh;return en?("<span class='zh2'>"+zh+"<span class='en'>"+en+"</span></span>"):zh;}
let DATA=null,charts=[],dcharts=[],heatMkt="ALL",heatSector=null;
function setColorMode(g){GREENUP=g;applyColorMode();try{localStorage.setItem("greenup",g?"1":"0");}catch(e){}
  charts.forEach(c=>{try{c.dispose();}catch(e){}});charts=[];
  var ov=document.getElementById("overview");if(ov)ov.removeAttribute("data-done");
  heatSector=null;renderAll();
  if(location.hash.indexOf("#/d/")===0)renderDetail(decodeURIComponent(location.hash.slice(4)));
  var b=document.getElementById("cmode");if(b)b.textContent=cmodeLabel();}

/* —— 预览回退:实时接口不可用时(本地双击/无网/预览)用随机示例数据渲染版面 —— */
function genHist(seed){
  let x=0;for(let i=0;i<seed.length;i++)x=(x*31+seed.charCodeAt(i))>>>0;x=x||7;
  function rnd(){x=(x*1103515245+12345)>>>0;return (x%100000)/100000;}
  const n=130,d=[],o=[],h=[],l=[],c=[],v=[];let px=20+rnd()*380;
  const st=new Date();st.setDate(st.getDate()-Math.round(n*1.4));
  for(let i=0;i<n;i++){const op=px,cl=op*(0.965+rnd()*0.07);
    const dt=new Date(st);dt.setDate(st.getDate()+Math.round(i*1.4));
    d.push((""+(dt.getMonth()+1)).padStart(2,"0")+"-"+(""+dt.getDate()).padStart(2,"0"));

    var d=await r.json();var q=(d&&d.quotes)||{};
    for(var yf in q){var v=q[yf];if(!v||v.price==null)continue;
      if(target.tickers[yf]){target.tickers[yf].price=v.price;target.tickers[yf].prev=v.prev;target.tickers[yf].pct=v.pct;got++;}
      if(target.indices[yf]){target.indices[yf].price=v.price;target.indices[yf].prev=v.prev;target.indices[yf].pct=v.pct;}}
  }
  return got;
}

async function liveSearch(q){
  q=(q||"").trim();if(!q)return;const rt=document.getElementById("rt");
  if(looksSym(q)){let sym=q.toUpperCase();if(/^\d{6}$/.test(sym))sym+=cnSuffix(sym);return fetchAdhoc(sym);}
  if(DATA&&DATA._preview){if(rt)rt.innerHTML="<div class='empty'>"+L("预览模式无法按名称搜索(需后端);可直接输入代码/Ticker,如 TSLA、600519。","Name search needs the live backend; in preview enter a code/ticker directly, e.g. TSLA, 600519.")+"</div>";return;}
  if(rt)rt.innerHTML="<div class='empty'>"+L("正在搜索 ","Searching ")+"“"+q+"” …</div>";
  try{
    const r=await fetch("/api/search?q="+encodeURIComponent(q));const d=await r.json();
    const list=(d&&d.results)||[];if(!list.length)throw 0;
    let h="<div class='empty'>"+L("“"+q+"” 的候选(点击查看):","Candidates for “"+q+"” (click to view):")+"<div style='display:flex;flex-direction:column;gap:6px;max-width:400px;margin:12px auto 0'>";
    list.slice(0,8).forEach(x=>{const nm=(x.name||"").replace(/['\\]/g,"");h+="<button class='backbtn' style='text-align:left' onclick=\"fetchAdhoc('"+x.sym+"','"+nm+"')\">"+x.name+" <span style='color:var(--dim);font-family:var(--mono);font-size:11px'>"+x.sym+" · "+(x.market==='CN'?L('A股','CN'):L('美股','US'))+"</span></button>";});
    h+="</div></div>";if(rt)rt.innerHTML=h;
  }catch(e){if(rt)rt.innerHTML="<div class='empty'>"+L("未搜到 ","No result for ")+"“"+q+"”"+L("。可改用代码/Ticker,或确认后端(/api/search)已部署。",". Try a code/ticker, or confirm the backend (/api/search) is deployed.")+"</div>";}
}
async function fetchAdhoc(sym,name){
  if(DATA&&DATA._preview){injectAdhoc(sym,name||sym,null);return;}
  const rt=document.getElementById("rt");if(rt)rt.innerHTML="<div class='empty'>"+L("正在拉取 ","Fetching ")+(name||sym)+" …</div>";
  try{const r=await fetch("/api/stock?sym="+encodeURIComponent(sym),{cache:"no-store"});if(!r.ok)throw 0;
    const d=await r.json();if(!d||d.error||!d.history||!d.history.c||d.history.c.length<2)throw 0;injectAdhoc(d.sym,name||d.name,d);}
  catch(e){if(rt)rt.innerHTML="<div class='empty'>"+L("未查到 ","Not found: ")+(name||sym)+L(",或实时后端未部署。",", or the live backend isn't deployed.")+"</div>";}
}
function injectAdhoc(sym,name,d){
  const mkt=/\.(SS|SZ|BJ)$/.test(sym)?"CN":"US";
  const h=(d&&d.history)?d.history:genHist(sym);
  DATA.history[sym]=h;
  const last=d?d.price:h.c[h.c.length-1],prev=d?d.prev:h.c[h.c.length-2];
  DATA.tickers[sym]={code:sym.split(".")[0],name:name||sym,en:null,market:mkt,kind:"stock",
    price:last,prev:prev,pct:(d&&d.pct!=null)?d.pct:+((last-prev)/prev*100).toFixed(2),_adhoc:true};
  go(sym);
}

/* ============ 技术指标 ============ */
function MA(a,n){return a.map((_,i)=>i<n-1?null:+(a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n).toFixed(2));}
function EMA(a,n){const k=2/(n+1),e=[];a.forEach((v,i)=>e.push(i===0?v:+(v*k+e[i-1]*(1-k)).toFixed(4)));return e;}
function MACD(c){const e12=EMA(c,12),e26=EMA(c,26),dif=c.map((_,i)=>+(e12[i]-e26[i]).toFixed(3)),dea=EMA(dif,9);
  return {dif,dea,macd:dif.map((_,i)=>+((dif[i]-dea[i])*2).toFixed(3))};}
function RSI(c,n){const r=[null];let g=0,l=0;
  for(let i=1;i<c.length;i++){const ch=c[i]-c[i-1],gg=Math.max(ch,0),ll=Math.max(-ch,0);
    if(i<n){g+=gg;l+=ll;r.push(null);}else if(i===n){g=(g+gg)/n;l=(l+ll)/n;r.push(+(100-100/(1+g/(l||1e-9))).toFixed(2));}
    else{g=(g*(n-1)+gg)/n;l=(l*(n-1)+ll)/n;r.push(+(100-100/(1+g/(l||1e-9))).toFixed(2));}}return r;}
function BOLL(c,n=20,k=2){const ma=MA(c,n),up=[],dn=[];c.forEach((_,i)=>{if(i<n-1){up.push(null);dn.push(null);return;}
  const seg=c.slice(i-n+1,i+1),m=ma[i],sd=Math.sqrt(seg.reduce((s,v)=>s+(v-m)*(v-m),0)/n);up.push(+(m+k*sd).toFixed(2));dn.push(+(m-k*sd).toFixed(2));});return {mid:ma,up,dn};}
function KDJ(hh,ll,c,n=9){let K=50,D=50;const Ka=[],Da=[],Ja=[];c.forEach((_,i)=>{if(i<n-1){Ka.push(null);Da.push(null);Ja.push(null);return;}
  const h=Math.max(...hh.slice(i-n+1,i+1)),l=Math.min(...ll.slice(i-n+1,i+1)),rsv=h===l?50:(c[i]-l)/(h-l)*100;
  K=2/3*K+1/3*rsv;D=2/3*D+1/3*K;Ka.push(+K.toFixed(2));Da.push(+D.toFixed(2));Ja.push(+(3*K-2*D).toFixed(2));});return {K:Ka,D:Da,J:Ja};}

function analyzeCard(h,meta){
  const c=h.c,n=c.length;if(n<30)return "";
  const px=(meta.price!=null)?meta.price:c[n-1];
  const ma=k=>{const s=c.slice(Math.max(0,n-k));return s.reduce((a,b)=>a+b,0)/s.length;};
  const ma20=ma(20),ma60=ma(60);
  const rA=RSI(c,14),rsi=rA[rA.length-1];
  const m=MACD(c),bull=m.dif[n-1]>m.dea[n-1];
  const hh=Math.max(...h.h),ll=Math.min(...h.l);
  const h20=Math.max(...h.h.slice(-20)),l20=Math.min(...h.l.slice(-20)),l60=Math.min(...h.l.slice(-60));
  const dM=(px-ma20)/ma20*100;
  const up=px>ma20&&ma20>ma60,dn=px<ma20&&ma20<ma60,ob=rsi!=null&&rsi>=72,os=rsi!=null&&rsi<=30,ext=dM>25;
  const res=h20>px?h20:hh,sup1=l20<px?l20:ma20,sup2=l60;
  const MID=L("中","Medium"),MH=L("中高","Med-High");
  let rk,cat,conf;
  if(up&&bull&&!ob){rk="add";cat="add";conf=dM>8?MH:MID;}
  else if(up&&ob){rk="hold";cat="holdOB";conf=MH;}
  else if(dn&&!bull){rk=os?"reduce":"avoid";cat="weak";conf=MID;}
  else{rk="hold";cat="neutral";conf=MID;}
  var _seed=String(meta.code||"")+String(meta.name||"")+String(meta.market||"")+cat;
  var concl=L.apply(null,vpick(A_CONCL[cat],_seed));
  var sug=L.apply(null,vpick(A_SUG[cat],_seed));
  const rating=L({add:"增持",hold:"持有",reduce:"减持",avoid:"回避"}[rk],{add:"Accumulate",hold:"Hold",reduce:"Reduce",avoid:"Avoid"}[rk]);
  const rcol=(rk==="add")?UP:((rk==="reduce"||rk==="avoid")?DOWN:"#f5a623");
  const S=L("强","Strong"),M2=L("中","Med"),WM=L("弱-中","Weak-Med"),MS=L("中-强","Med-Strong");
  var _tok={side:px>=ma20?"站上":"跌破",sideE:px>=ma20?"above":"below",
    dm:(dM>=0?"+":"")+dM.toFixed(1),cross:ma20>=ma60?"上":"下",crossE:ma20>=ma60?"above":"below",
    stack:ma20>=ma60?"多头排列":"空头排列",stackE:ma20>=ma60?"bullish stack":"bearish stack",
    macd:bull?"多头":"空头",macdE:bull?"bull":"bear",rsi:(rsi!=null?rsi.toFixed(0):"—"),
    rst:ob?"超买":os?"超卖":"中性",rstE:ob?"overbought":os?"oversold":"neutral",
    oh:((hh-px)/hh*100).toFixed(1),ol:((px-ll)/ll*100).toFixed(1),
    crowd:ext?",乖离偏大、偏拥挤":",位置适中",crowdE:ext?", over-extended/crowded":", mid-range",
    s1:f2(sup1),s2:f2(sup2),res:f2(res)};
  const reasons=[
    [L.apply(null,tfill(vpick(A_R0,_seed+"r0"),_tok)),(up||dn)?S:M2],
    [L.apply(null,tfill(vpick(A_R1,_seed+"r1"),_tok)),(ob||os)?MS:M2],
    [L.apply(null,tfill(vpick(A_R2,_seed+"r2"),_tok)),ext?M2:WM]
  ];
  var _heldCat=rk==="add"?"add":(rk==="hold"?"hold":"weak");
  const held=L.apply(null,tfill(vpick(A_HELD[_heldCat],_seed+"h"),_tok));
  const unheld=L.apply(null,tfill(vpick(A_UNHELD,_seed+"u"),_tok));
  const stop=L.apply(null,tfill(vpick(A_STOP,_seed+"st"),_tok));
  const risks=[
    L("技术面:收盘跌破 ","Technical: a close below ")+f2(sup1)+L(" 转弱(触发:破位即减仓)"," turns it weak (trigger: trim on break)"),
    ob?L.apply(null,A_RISK_OB):L.apply(null,vpick(A_RISK2,_seed+"rk2")),
    L.apply(null,vpick(A_RISK3,_seed+"rk3"))
  ];
  const upd=meta.market==="US"?(DATA.meta||{}).updated_us:(DATA.meta||{}).updated_cn;
  const stamp=(upd?new Date(upd).toLocaleString(locale()):"")+(meta.market==="US"?L(" · 美东参考"," · US Eastern"):L(" · 北京时间"," · Beijing time"));
  let H="<div class='analysis'>";
  H+="<div class='ahdr'>📊 "+(meta.name||"")+" "+(meta.code||"")+"｜"+L("评级","Rating")+" <b style='color:"+rcol+"'>"+rating+"</b>("+conf+L("信心","")+")｜"+L("建议:","Action: ")+sug+" <span class='ast'>· "+stamp+"</span></div>";
  H+="<div class='asec'><span class='atag'>"+L("结论","Verdict")+"</span>"+concl+"</div>";
  H+="<div class='asec'><span class='atag'>"+L("核心理由","Key reasons")+"</span><ul>"+reasons.map(r=>"<li>"+r[0]+" <em>("+r[1]+")</em></li>").join("")+"</ul></div>";
  H+="<div class='asec'><span class='atag'>"+L("交易计划","Trade plan")+"</span><ul><li><b>"+L("已持有:","If holding: ")+"</b>"+held+"</li><li><b>"+L("未持有:","If flat: ")+"</b>"+unheld+"</li><li><b>"+L("止损:","Stop: ")+"</b>"+stop+"</li></ul></div>";
  H+="<div class='asec'><span class='atag'>"+L("关键位","Key levels")+"</span>"+L("现价 ","Price ")+"<b>"+f2(px)+"</b>｜"+L("阻力 ","Resistance ")+f2(res)+"｜"+L("支撑 ","Support ")+f2(sup1)+" / "+f2(sup2)+"</div>";
  H+="<div class='asec'><span class='atag'>"+L("风险","Risks")+"</span><ul>"+risks.map(r=>"<li>"+r+"</li>").join("")+"</ul></div>";
  H+="<div class='adata'>"+L("【数据】技术面(价/量/MA/MACD/RSI/BOLL/区间高低)完整;估值/目标价/财报/资金/做空 未接入(免费技术面版)","[Data] Technicals complete (price/volume/MA/MACD/RSI/BOLL/range); valuation/target/earnings/flows/short interest not included (free technical version)")+"</div>";
  H+="<div class='adisc'>⚠ "+L("AI 技术面参考,不构成投资建议","AI technical reference — not investment advice")+"</div></div>";
  return H;
}

function computeSignals(h){
  const c=h.c,ma=MA(c,20),m=MACD(c),rsi=RSI(c,14),b=BOLL(c),i=c.length-1;

  if(rsi[i]!=null){const r=rsi[i];add("RSI",r.toFixed(0)+(r>70?L(" 超买"," OB"):r<30?L(" 超卖"," OS"):""),r>70?"bad":r<30?"good":"neu");}
  if(m.dif[i]!=null){const bull=m.dif[i]>m.dea[i];add("MACD",bull?L("多头","Bull"):L("空头","Bear"),bull?"good":"bad");}
  if(ma[i]!=null)add("MA20",c[i]>=ma[i]?L("价在上方","Above"):L("价在下方","Below"),c[i]>=ma[i]?"good":"bad");
  if(b.up[i]!=null){const pos=c[i]>b.up[i]?L("触上轨","Upper"):c[i]<b.dn[i]?L("触下轨","Lower"):L("通道内","Mid");add("BOLL",pos,pos===L("触上轨","Upper")?"bad":pos===L("触下轨","Lower")?"good":"neu");}
  return {chips:chips.join(""),good,bad,ma20:ma[i],rsi:rsi[i]};
}

/* ECharts 多源加载:国内可达 CDN 优先,jsdelivr/cdnjs 兜底,每源 4s 超时跳下一个 */
function loadEcharts(cb){
  if(typeof echarts!=="undefined"){cb();return;}
  var urls=["https://cdn.staticfile.org/echarts/5.5.0/echarts.min.js",
            "https://lib.baomitu.com/echarts/5.5.0/echarts.min.js",
            "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js",
            "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"];
  var i=0,done=false;
  function finish(){if(done)return;done=true;cb();}
  function next(){
    if(done)return;
    if(i>=urls.length){finish();return;}
    var s=document.createElement("script");s.src=urls[i++];
    var t=setTimeout(function(){s.onload=s.onerror=null;next();},4000);
    s.onload=function(){clearTimeout(t);if(typeof echarts!=="undefined")finish();else next();};
    s.onerror=function(){clearTimeout(t);next();};
    document.head.appendChild(s);
  }
  next();
}
