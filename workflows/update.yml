name: Update market data

# 定时(UTC)。注意:cron 是固定 UTC,美股时间随美国夏令时(EDT/EST)平移 1 小时,
# 下面按夏令时(EDT, UTC-4)安排;冬令时会早 1 小时,可按需微调。
on:
  workflow_dispatch:
    inputs:
      market:
        description: "市场 cn / us / both"
        default: "both"
      mode:
        description: "模式 preview / summary"
        default: "summary"
  schedule:
    - cron: "30 0 * * 1-5"       # A股盘前前瞻(08:30 北京)
    - cron: "*/5 1-7 * * 1-5"    # A股盘中每5分钟(约 09:00-15:55 北京)
    - cron: "30 12 * * 1-5"      # 美股盘前前瞻(美东 08:30)
    - cron: "*/5 13-21 * * 1-5"  # 美股盘中每5分钟(约 09:00-17:55 美东)

permissions:
  contents: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Decide market & mode
        id: cfg
        run: |
          MARKET="${{ github.event.inputs.market }}"
          MODE="${{ github.event.inputs.mode }}"
          case "${{ github.event.schedule }}" in
            "30 0 * * 1-5")  MARKET=cn; MODE=preview ;;
            "30 12 * * 1-5") MARKET=us; MODE=preview ;;
            *)               MARKET=both; MODE=summary ;;
          esac
          MARKET="${MARKET:-both}"; MODE="${MODE:-summary}"
          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Run -> market=$MARKET mode=$MODE"

      - name: Fetch & build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-6
        run: python fetch.py --market ${{ steps.cfg.outputs.market }} --mode ${{ steps.cfg.outputs.mode }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "data: ${{ steps.cfg.outputs.market }}/${{ steps.cfg.outputs.mode }} $(date -u +%FT%TZ)" || echo "no changes"
          git push
